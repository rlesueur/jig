[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jig"
version = "0.1.0"
description = "Jig: an open-source, always-on personal AI agent that runs only on local models."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",
    "keyring>=25; sys_platform != 'win32'",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jig = "jig.cli:main"

[tool.setuptools.packages.find]
include = ["jig*"]

[tool.setuptools.package-data]
jig = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["network: test needs public internet access",
           "compose: test needs a running compose stack (JIG_STACK_URL)"]
