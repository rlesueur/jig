# D1 full v2 (protocol v0.4), Qwen reviewer condition only: Jig's Sentinel on Qwen3.8 27B Q4_K_M next to the
# ternary agent on 8080. Identical to d1_full_v2.yaml in every other respect.
#
# Context sized from measurement (2026-10-02): the 175 Granite Guardian reviews in d1-full-v1 used at most
# 446 tokens (median 285) for the same intent/action/policy inputs; Jig's Sentinel template adds about 670
# characters of system prompt, so a review prompt is about 1k tokens. Jig's Sentinel may then generate up to
# its max_tokens (8192), so ctx = 1024 + 8192 rounded up = 10240 (was 16384).
# VRAM: the guard's estimate is about 19,440 MiB plus 2,048 MiB headroom; next to 8080 about 18,770 MiB was
# free, so the guard is expected to refuse this server until more VRAM is free. It fails loudly; nothing degrades.
name: d1-full-v2-qwen
experiment: d1
benchmark: {name: AgentDojo, version: v1, licence: MIT, url: "https://github.com/ethz-spylab/agentdojo",
            citation: "arXiv:2406.13352"}

suites: [banking, slack, travel, workspace]
attacks: ["none", "important_instructions", "injecagent"]
seeds: [0, 1, 2]
max_steps: 20
sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05}

endpoints:
  bonsai: {base_url: "http://127.0.0.1:8080/v1"}
  qwen27b: {server: {model: qwen38-27b-q4km, port: 8093, ctx: 10240, parallel: 1}}

agent: {endpoint: bonsai, name: bonsai-2-27b}

conditions:
  - {id: sentinel-qwen-action, reviewer: model, sentinel: {endpoint: qwen27b, name: qwen38-27b-q4km}, mode: action}
