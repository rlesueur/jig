<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/web/style.css">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';</script>
<style>
  body { display: block; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(6, 210px); gap: 10px; }
  figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
  jig-avatar { width: 196px; height: 196px; display: block; }
  figcaption { font: 700 12px var(--font); color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
  import '/avatar/jig-avatar.js';
  const theme = document.documentElement.dataset.theme;
  const cases = [
    ['idle', null, [1.5, 3, 4.5]], ['thinking', null, [1.5, 2.5, 3.5]], ['working', 'coding', [1.5, 2.5, 3.5]],
    ['working', 'browsing', [1.5, 2.5, 3.5]], ['working', 'writing', [1.5, 2.5, 3.5]], ['working', 'scheduling', [1.5, 2.5, 3.5]],
    ['approval', null, [1.2, 2, 2.8]], ['success', null, [1.2, 2.2, 3.2, 3.8, 4.6, 6]], ['error', null, [2, 3, 4]],
    ['paused', null, [2, 3, 4]], ['dance', null, [1, 3, 6.6]], ['talking', null, [2, 3, 4]],
  ];
  const grid = document.getElementById('grid');
  for (const seed of [7]) {
    for (const [state, task, times] of cases) {
      for (const t of times) {
        const fig = document.createElement('figure');
        const a = document.createElement('jig-avatar');
        a.setAttribute('clock', 'manual'); a.setAttribute('seed', String(seed)); a.setAttribute('framing', 'full');
        a.setAttribute('shape', 'none'); a.setAttribute('theme', theme);
        fig.append(a);
        const cap = document.createElement('figcaption'); cap.textContent = `${state}${task ? ':' + task : ''} t=${t}`;
        fig.append(cap); grid.append(fig);
        await new Promise((r) => requestAnimationFrame(r));
        a.setState(state, task ? { task } : {});
        a.advance(t, 60);
      }
    }
  }
  window.__ready = true;
</script>
</body>
</html>
