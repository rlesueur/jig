# Jig configuration. Jig is built for local models: it works with any capable
# model behind an OpenAI-compatible endpoint that supports tool calling. See
# profiles/ for examples (llama.cpp, Ollama, LM Studio, vLLM) and copy one over
# this file, or point JIG_CONFIG / --config at it. To bring a cloud model
# (OpenAI, OpenRouter, Anthropic, Gemini), start from profiles/<provider>.toml
# and read "Using a cloud model" in README.md.
#
# Relative paths are resolved against this file's folder.
# Environment overrides: JIG_CONFIG, JIG_MODEL_BASE_URL, JIG_MODEL_NAME,
# JIG_DATA_DIR, JIG_SANDBOX_DIR, JIG_HOST, JIG_PORT.

[model]
base_url = "http://127.0.0.1:8080/v1"
# Leave empty to discover the model from /v1/models (fails loudly if the server serves more than one).
name = ""
# Name of an environment variable holding an API key, if your server needs one.
api_key_env = ""
# Or keep the key in the vault instead: 'jig model key set <name>', then
#   api_key_secret = "model-key.<name>"
# A cloud endpoint (anything that isn't loopback, a private or Tailscale address,
# or a local name) must use https:// and needs both of these before Jig starts:
#   allow_cloud = true          and          jig model cloud confirm
# provider = "openai" | "openrouter" | "anthropic" | "gemini" tells Jig that
# provider's documented differences; anything it doesn't support is an error.
connect_timeout_s = 5.0
read_timeout_s = 600.0
# No output limit is sent unless you set one: local servers are bounded by their
# context window, and a reasoning model's thinking would count towards a limit.
# Set max_tokens = <tokens> only if you want a cap.

# Sent as-is with every request. Tune per model and only include keys your server accepts.
[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05

# The safety checker (Sentinel) inherits everything from [model] unless set here, so by
# default it uses the agent's own model and server: no second model is loaded. A different
# model is an optional, advanced setting that costs that model's memory on top of the
# agent's (see "The safety checker's model" in README.md). It never inherits allow_cloud,
# and when its base_url differs it gets none of [model]'s key or provider settings. Example:
#   base_url = "http://127.0.0.1:11434/v1"
#   name = "your-reviewer-model"
[sentinel]

# Image input. Off by default, because most models can't see pictures. To turn it on, set
# enabled = true and use a vision-capable model: for llama.cpp start llama-server with
# --mmproj <projector.gguf>; in Ollama or LM Studio pick a vision model. When enabled,
# Jig sends a real test image at start-up and won't start the agent if the model can't see it.
[vision]
enabled = false

# "directory": file tools confined to a folder; no code execution or browser.
# "container": code, shell and the headless browser run in a hardened Docker container
# (build the image first with `jig sandbox build`). Jig refuses to start if Docker is unavailable.
[sandbox]
backend = "directory"

[paths]
data_dir = "data"
sandbox_dir = "sandbox"

[runtime]
agent_id = "default"
timezone = "Europe/London"
max_steps = 12
# Keep this below the number of parallel requests your server handles, leaving room for chat and the Sentinel.
max_concurrent_tasks = 3
heartbeat_s = 2.0
min_context_tokens = 32768

[tools.web_fetch]
timeout_s = 20.0
max_bytes = 2_000_000
max_chars = 12_000
max_redirects = 5

[server]
host = "127.0.0.1"
port = 8766
