# Example: LM Studio's local server (Developer tab, "Start server").
# Load a model with tool-use support and a context of 32K or more. If several models are loaded,
# set 'name' to the identifier LM Studio shows; otherwise it is discovered from /v1/models.
#   jig --config profiles/lmstudio.toml serve

[model]
base_url = "http://127.0.0.1:1234/v1"
name = ""
max_tokens = 8192

[model.sampling]
temperature = 0.7
top_p = 0.9

# The safety checker (Sentinel) uses the same model and server as the agent, so nothing extra is loaded.
# A different model is optional; see "The safety checker's model" in README.md.
[sentinel]

[paths]
data_dir = "../data"
sandbox_dir = "../sandbox"

[runtime]
max_concurrent_tasks = 2

[server]
port = 8766
