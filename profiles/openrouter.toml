# Cloud: OpenRouter (one key, many models). Jig is built for local models; with this profile the agent's
# requests go to OpenRouter and the upstream provider it routes to. Read "Using a cloud model" in README.md first.
#
# Set up (each step is explicit; Jig refuses to start until all three are done):
#   1. jig --config profiles/openrouter.toml model key set openrouter   paste the key; stored in the vault
#   2. jig --config profiles/openrouter.toml model cloud confirm        shows what is sent; recorded in the audit log
#   3. jig --config profiles/openrouter.toml serve
# Get a key at https://openrouter.ai/settings/keys
#
# Checked against OpenRouter's documentation (October 2026):
# - https://openrouter.ai/docs/api_reference/overview: OpenAI-shaped requests at /api/v1; tools.
# - https://openrouter.ai/docs/api_reference/parameters: max_tokens is optional (at most the context length minus
#   the prompt), so Jig sends none unless you set max_tokens here; reasoning counts towards it.
# - https://openrouter.ai/docs/guides/features/tool-calling: pick a model listed at
#   https://openrouter.ai/models?supported_parameters=tools
# - https://openrouter.ai/docs/guides/routing/provider-selection: by default, providers that don't support a
#   parameter "will ignore unknown parameters". require_parameters = true below stops that: a request is only
#   routed to providers that support everything Jig sends (tools and structured output), or it fails clearly.
# - https://openrouter.ai/docs/guides/best-practices/reasoning-tokens: reasoning arrives as "reasoning" and
#   "reasoning_details"; Jig shows the first and passes the second back unmodified, as asked.

[model]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
name = "anthropic/claude-sonnet-5.5"
api_key_secret = "model-key.openrouter"
# You accept that your conversation, memory snippets in prompts, tool results and images are sent to
# OpenRouter and the provider it routes to.
allow_cloud = true

# Sent with every request (OpenRouter's provider routing preferences).
[model.sampling.provider]
require_parameters = true
# Only providers that don't collect your data. Add zdr = true for zero-data-retention endpoints only.
data_collection = "deny"

# The safety checker (Sentinel) uses the same model as the agent by default, so no second model is needed.
# Its checks then go to OpenRouter too: each action Jig wants to take, with its details. allow_cloud below
# accepts that for the safety checker; 'jig model cloud confirm' covers both roles in one confirmation.
[sentinel]
allow_cloud = true

# Optional: run the safety checker on a LOCAL model instead, so its reviews never leave this computer and it
# is independent of OpenRouter. You then need a local model server running, with the memory that model takes.
# Replace the [sentinel] section above with (llama.cpp's default address shown):
# [sentinel]
# base_url = "http://127.0.0.1:8080/v1"
# name = ""

# Set to true with a vision-capable model; Jig checks it with a real image at start-up.
[vision]
enabled = false

[paths]
data_dir = "../data"
sandbox_dir = "../sandbox"

[server]
port = 8766
