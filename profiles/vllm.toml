# Example: vLLM's OpenAI-compatible server. Tool calling must be switched on when starting it:
#   vllm serve <model> --enable-auto-tool-choice --tool-call-parser <parser for your model>
# If you pass --api-key, export it and name the variable in api_key_env.
#   jig --config profiles/vllm.toml serve

[model]
base_url = "http://127.0.0.1:8000/v1"
name = ""
api_key_env = ""   # e.g. "VLLM_API_KEY"
[model.sampling]
temperature = 0.7
top_p = 0.9

# The safety checker (Sentinel) uses the same model and server as the agent, so nothing extra is loaded.
# A different model is optional; see "The safety checker's model" in README.md.
[sentinel]

[paths]
data_dir = "../data"
sandbox_dir = "../sandbox"

[runtime]
max_concurrent_tasks = 4

[server]
port = 8766
