name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "avatar/jig-avatar.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # The avatar component lives in avatar/ and is copied in at build time, not duplicated in site/.
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          cp avatar/jig-avatar.js _site/jig-avatar.js
          for f in index.html main.js styles.css jig-avatar.js media/jig-promo.mp4 media/jig-promo-cover.jpg media/og-image.jpg media/favicon.png; do
            test -s "_site/$f" || { echo "::error::missing _site/$f"; exit 1; }
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
